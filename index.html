<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manga Tracker</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#88C0D0">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #000;
    color: #D8DEE9;
    font-family: Roboto, sans-serif;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: #0a0a0a;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid #1a1a1a;
  }

  header h1 { font-size: 1.1rem; color: #88C0D0; flex: 1; }

  #add-btn {
    background: #88C0D0;
    color: #000;
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-weight: bold;
    cursor: pointer;
    font-size: 0.9rem;
  }

  #add-btn:active { background: #81A1C1; }

  #list-view, #detail-view {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
  }

  #list-status-controls { padding: 12px 12px 0; }

  #detail-view { display: none; flex-direction: column; gap: 14px; }

  .manga-card {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #0d0d0d;
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 10px;
    cursor: pointer;
    border: 1px solid #1a1a1a;
  }

  .manga-card:active { background: #151515; }

  .manga-card img {
    width: 50px;
    height: 50px;
    object-fit: cover;
    border-radius: 6px;
    background: #1a1a1a;
    flex-shrink: 0;
  }

  .manga-card .placeholder {
    width: 50px;
    height: 50px;
    border-radius: 6px;
    background: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    flex-shrink: 0;
  }

  .manga-info { flex: 1; min-width: 0; }
  .manga-title { font-weight: bold; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .manga-meta { font-size: 0.8rem; color: #88C0D0; margin-top: 2px; }

  #detail-cover {
    width: 100%;
    height: 220px;
    object-fit: contain;
    border-radius: 10px;
    background: #0d0d0d;
    display: none;
    cursor: zoom-in;
  }

  #detail-cover.visible { display: block; }

  #cover-fullscreen {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    cursor: zoom-out;
  }

  #cover-fullscreen.open { display: flex; }

  #cover-fullscreen img {
    max-width: 95vw;
    max-height: 95dvh;
    object-fit: contain;
    border-radius: 8px;
  }

  #cover-placeholder {
    width: 100%;
    height: 120px;
    background: #0d0d0d;
    border: 2px dashed #2a2a2a;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #555;
    font-size: 0.9rem;
    cursor: pointer;
  }

  #cover-placeholder:active { border-color: #88C0D0; }

  .cover-btn-row { display: flex; gap: 10px; }

  label { font-size: 0.8rem; color: #88C0D0; display: block; margin-bottom: 4px; }

  input, textarea, select {
    width: 100%;
    background: #0d0d0d;
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    color: #D8DEE9;
    padding: 10px;
    font-size: 0.95rem;
    font-family: inherit;
  }

  input:focus, textarea:focus, select:focus { outline: none; border-color: #88C0D0; }

  textarea { resize: vertical; min-height: 80px; }

  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }

  .num-input { display: flex; align-items: center; gap: 6px; }
  .num-input input { text-align: center; flex: 1; -moz-appearance: textfield; }
  .num-input input::-webkit-outer-spin-button,
  .num-input input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .num-btn {
    background: #1a1a1a;
    color: #88C0D0;
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    width: 44px !important;
    height: 44px;
    font-size: 1.4rem;
    cursor: pointer;
    flex: none !important;
    padding: 0;
    align-self: stretch;
    height: auto;
    aspect-ratio: 1;
  }
  .num-btn:active { background: #2a2a2a; }

  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

  button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: bold;
    cursor: pointer;
  }

  .btn-primary { background: #88C0D0; color: #000; }
  .btn-primary:active { background: #81A1C1; }
  .btn-danger { background: #BF616A; color: #fff; }
  .btn-danger:active { background: #a0505a; }
  .btn-secondary { background: #2a2a2a; color: #D8DEE9; }
  .btn-secondary:active { background: #333; }

  #back-btn {
    background: none;
    border: none;
    color: #88C0D0;
    font-size: 1.4rem;
    cursor: pointer;
    padding: 0;
    line-height: 1;
    flex: none;
    width: auto;
  }

  .spinner {
    text-align: center;
    padding: 40px;
    color: #555;
  }

  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #88C0D0;
    color: #000;
    padding: 10px 20px;
    border-radius: 20px;
    font-weight: bold;
    font-size: 0.85rem;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 999;
  }

  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <button id="back-btn" style="display:none">&#8592;</button>
  <h1 id="header-title">Manga Tracker</h1>
  <button id="add-btn">+ Add</button>
</header>

<div id="list-status-controls">
  <label for="status-filter">Status</label>
  <select id="status-filter">
    <option value="">All statuses</option>
    <option value="reading">Reading</option>
    <option value="completed">Completed</option>
    <option value="on_hold">On hold</option>
    <option value="dropped">Dropped</option>
    <option value="plan_to_read">Plan to read</option>
  </select>
</div>
<div id="list-view"><div class="spinner">Loading...</div></div>

<div id="detail-view">
  <img id="detail-cover" alt="Cover" onclick="openFullscreen(this.src)">
  <div id="cover-fullscreen" onclick="this.classList.remove('open')">
    <img id="fullscreen-img" alt="Full Cover">
  </div>
  <div id="cover-placeholder" onclick="document.getElementById('cover-input').click()">📷 Tap to add cover image</div>
  <div class="cover-btn-row">
    <button class="btn-secondary" style="font-size:0.85rem" onclick="document.getElementById('cover-input').click()">Change Cover</button>
    <button class="btn-danger" style="font-size:0.85rem" id="remove-cover-btn">Remove Cover</button>
  </div>
  <input type="file" id="cover-input" accept="image/*" style="display:none">
  <div>
    <label>Title</label>
    <input id="d-title" type="text" placeholder="Title">
  </div>
  <div>
    <label>Description</label>
    <textarea id="d-desc" placeholder="Description"></textarea>
  </div>
  <div>
    <label>Chapter</label>
    <div class="num-input">
      <button class="num-btn" onclick="stepChapter(-1)">−</button>
      <input id="d-chapter" type="number" min="0" step="1" placeholder="0" inputmode="numeric">
      <button class="num-btn" onclick="stepChapter(1)">+</button>
    </div>
  </div>
  <div>
    <label>Status</label>
    <select id="d-status">
      <option value="reading">Reading</option>
      <option value="completed">Completed</option>
      <option value="on_hold">On hold</option>
      <option value="dropped">Dropped</option>
      <option value="plan_to_read" selected>Plan to read</option>
    </select>
  </div>
  <div>
    <label>Score</label>
    <select id="d-score">
      <option value="">-</option>
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option>
      <option value="6">6</option>
      <option value="7">7</option>
      <option value="8">8</option>
      <option value="9">9</option>
      <option value="10">10</option>
    </select>
  </div>
  <div class="btn-row">
    <button class="btn-primary" id="save-btn">Save</button>
    <button class="btn-danger" id="delete-btn">Delete</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const listView = document.getElementById('list-view');
  const detailView = document.getElementById('detail-view');
  const backBtn = document.getElementById('back-btn');
  const addBtn = document.getElementById('add-btn');
  const listStatusControls = document.getElementById('list-status-controls');
  const statusFilter = document.getElementById('status-filter');
  const headerTitle = document.getElementById('header-title');
  const toast = document.getElementById('toast');

  const STATUS_LABELS = {
    reading: 'Reading',
    completed: 'Completed',
    on_hold: 'On hold',
    dropped: 'Dropped',
    plan_to_read: 'Plan to read'
  };

  let manga = [];
  let editingId = null;
  let pendingCoverFile = null;
  let coverRemoved = false;

  function esc(text) {
    return String(text ?? '').replace(/[&<>"']/g, ch => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[ch]);
  }

  function coverUrl(id) {
    return `/api/cover?id=${encodeURIComponent(id)}`;
  }

  async function loadManga() {
    try {
      const r = await fetch('/api/manga');
      manga = await r.json();
      renderList();
    } catch {
      listView.innerHTML = '<div class="spinner">Could not connect to server.</div>';
    }
  }

  function formatChapter(chapter) {
    if (chapter === null || chapter === undefined || chapter === '') return null;
    const number = Number(chapter);
    if (Number.isNaN(number)) return null;
    return String(number);
  }

  function metaLine(entry) {
    const parts = [];
    const status = STATUS_LABELS[entry.status];
    if (status) parts.push(status);
    const chapter = formatChapter(entry.chapter);
    if (chapter !== null) parts.push(`Ch. ${chapter}`);
    if (entry.score !== null && entry.score !== undefined) parts.push(`${entry.score}/10`);
    return parts.join(' · ');
  }

  function renderList() {
    const filtered = manga.filter(entry => !statusFilter.value || entry.status === statusFilter.value);
    const sorted = filtered.sort((a, b) =>
      (a.title || '').toLowerCase().localeCompare((b.title || '').toLowerCase())
    );
    if (!manga.length) {
      listView.innerHTML = '<div class="spinner">No titles yet. Tap + Add to start.</div>';
      return;
    }
    if (!sorted.length) {
      listView.innerHTML = '<div class="spinner">No titles with this status.</div>';
      return;
    }
    listView.innerHTML = sorted.map(entry => {
      const img = entry.cover_image
        ? `<img src="${coverUrl(entry.id)}" alt="" onerror="this.outerHTML='<div class=placeholder>📖</div>'">`
        : `<div class="placeholder">📖</div>`;
      const meta = metaLine(entry);
      return `<div class="manga-card" data-id="${entry.id}">
        ${img}
        <div class="manga-info">
          <div class="manga-title">${esc(entry.title)}</div>
          ${meta ? `<div class="manga-meta">${esc(meta)}</div>` : ''}
        </div>
      </div>`;
    }).join('');
  }

  listView.addEventListener('click', e => {
    const card = e.target.closest('.manga-card');
    if (card) openDetail(Number(card.dataset.id));
  });

  function findEntry(id) {
    return manga.find(entry => Number(entry.id) === Number(id)) || null;
  }

  function openDetail(id, pushHistory = true) {
    editingId = id === null || id === undefined ? null : Number(id);
    pendingCoverFile = null;
    coverRemoved = false;
    const entry = editingId !== null ? findEntry(editingId) : null;

    document.getElementById('d-title').value = entry?.title || '';
    document.getElementById('d-desc').value = entry?.description || '';
    document.getElementById('d-chapter').value =
      entry && entry.chapter !== null && entry.chapter !== undefined ? entry.chapter : '';
    document.getElementById('d-status').value = entry?.status || 'plan_to_read';
    document.getElementById('d-score').value =
      entry && entry.score !== null && entry.score !== undefined ? String(entry.score) : '';
    document.getElementById('cover-input').value = '';

    setCover(entry?.cover_image ? coverUrl(editingId) : null);

    document.getElementById('delete-btn').style.display = entry ? '' : 'none';
    listStatusControls.style.display = 'none';
    listView.style.display = 'none';
    detailView.style.display = 'flex';
    backBtn.style.display = '';
    addBtn.style.display = 'none';
    headerTitle.textContent = entry?.title || 'New Title';
    if (pushHistory) {
      const url = editingId !== null ? `?id=${editingId}` : '';
      history.pushState({ detail: true, id: editingId }, '', url);
    }
  }

  function setCover(src) {
    const cover = document.getElementById('detail-cover');
    const placeholder = document.getElementById('cover-placeholder');
    if (src) {
      cover.src = src;
      cover.classList.add('visible');
      placeholder.style.display = 'none';
    } else {
      cover.removeAttribute('src');
      cover.classList.remove('visible');
      placeholder.style.display = 'flex';
    }
  }

  function showList(pushHistory = true) {
    detailView.style.display = 'none';
    listStatusControls.style.display = '';
    listView.style.display = '';
    backBtn.style.display = 'none';
    addBtn.style.display = '';
    headerTitle.textContent = 'Manga Tracker';
    if (pushHistory) history.pushState({ detail: false }, '', '');
  }

  async function saveManga() {
    const title = document.getElementById('d-title').value.trim();
    if (!title) return showToast('Title is required');

    const chapterValue = document.getElementById('d-chapter').value.trim();
    if (chapterValue !== '' && (!/^\d+$/.test(chapterValue) || Number(chapterValue) < 0)) {
      return showToast('Chapter must be a whole number of 0 or more');
    }
    const scoreValue = document.getElementById('d-score').value;
    const data = {
      title,
      description: document.getElementById('d-desc').value.trim(),
      status: document.getElementById('d-status').value,
      chapter: chapterValue === '' ? null : Number(chapterValue),
      score: scoreValue === '' ? null : Number(scoreValue)
    };

    let entry;
    try {
      if (editingId === null) {
        const r = await fetch('/api/manga', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        if (!r.ok) return showToast('Could not create title');
        entry = await r.json();
        if (r.status === 200) showToast('Title already existed — opened it');
      } else {
        const r = await fetch(`/api/manga/${editingId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        if (r.status === 409) return showToast('Another title already uses that name');
        if (!r.ok) return showToast('Could not save title');
        entry = await r.json();
      }
    } catch {
      return showToast('Could not connect to server');
    }

    editingId = Number(entry.id);

    if (pendingCoverFile) {
      try {
        const r = await fetch(`/api/manga/${editingId}/cover`, {
          method: 'POST',
          headers: { 'Content-Type': pendingCoverFile.type },
          body: pendingCoverFile
        });
        if (r.ok) entry = await r.json();
      } catch {}
    } else if (coverRemoved) {
      try {
        const r = await fetch(`/api/manga/${editingId}/cover`, { method: 'DELETE' });
        if (r.ok) entry = await r.json();
      } catch {}
    }

    pendingCoverFile = null;
    coverRemoved = false;
    await loadManga();
    showToast('Saved');
    openDetail(editingId, false);
    history.replaceState({ detail: true, id: editingId }, '', `?id=${editingId}`);
  }

  async function deleteManga() {
    if (editingId === null) return;
    try {
      await fetch(`/api/manga/${editingId}`, { method: 'DELETE' });
    } catch {}
    editingId = null;
    await loadManga();
    showToast('Deleted');
    showList(false);
    history.replaceState({ detail: false }, '', location.pathname);
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  }

  function openFullscreen(src) {
    if (!src) return;
    document.getElementById('fullscreen-img').src = src;
    document.getElementById('cover-fullscreen').classList.add('open');
  }

  function stepChapter(delta) {
    const el = document.getElementById('d-chapter');
    const current = parseInt(el.value, 10);
    const next = Math.max(0, (Number.isNaN(current) ? 0 : current) + delta);
    el.value = String(next);
  }

  document.getElementById('cover-input').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    pendingCoverFile = file;
    coverRemoved = false;
    setCover(URL.createObjectURL(file));
  });

  document.getElementById('remove-cover-btn').addEventListener('click', () => {
    pendingCoverFile = null;
    coverRemoved = true;
    setCover(null);
  });

  backBtn.addEventListener('click', () => { history.back(); });
  statusFilter.addEventListener('change', renderList);
  window.addEventListener('popstate', e => {
    if (e.state?.detail) openDetail(e.state.id, false);
    else showList(false);
  });
  addBtn.addEventListener('click', () => openDetail(null));
  document.getElementById('save-btn').addEventListener('click', saveManga);
  document.getElementById('delete-btn').addEventListener('click', deleteManga);

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');

  (async function init() {
    await loadManga();
    const params = new URLSearchParams(location.search);
    const requestedId = params.get('id');
    if (requestedId !== null && findEntry(requestedId)) {
      // Keep a list entry underneath the detail entry so Back returns to the list
      // instead of leaving the page when opened directly from the app.
      history.replaceState({ detail: false }, '', location.pathname);
      openDetail(requestedId, true);
    } else {
      history.replaceState({ detail: false }, '', location.pathname);
    }
  })();

  setInterval(async () => {
    if (detailView.style.display === 'flex') return;
    try {
      const r = await fetch('/api/manga');
      const fresh = await r.json();
      if (JSON.stringify(fresh) !== JSON.stringify(manga)) {
        manga = fresh;
        renderList();
      }
    } catch {}
  }, 2000);
</script>
</body>
</html>
